name: steering-eval-pilot
description: Local-first Waza pilot for the steering skill.
skill: steering
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.2-codex
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the steering skill stay focused on planning and durable artifacts?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the run avoid obvious drift into direct implementation?
tasks:
  - "tasks/*.yaml"
